    <link rel="stylesheet" href="responsive.css">

<body class="gastro-page">

    <nav class="gastro-nav">
        <a href="index.html" class="btn-back">← Ana Sayfa</a>
        <a href="days/day01.html" class="btn-back" style="background:linear-gradient(135deg,#667eea,#764ba2)">📖 Seyyah Günlüğü</a>
    </nav>

    <header class="gastro-hero">
        <div class="kanji">美味しい</div>
        <h1>Gastronomi Günlüğü</h1>
        <p>14 gün boyunca Japonya'nın sokaklarında, ara sokak ramencilerinde ve tezgah başlarında
           tattığım her lezzet. Mekanı, kişisel puanım ve fotoğraflarıyla — afiyet olsun! 🥢</p>
    </header>

    <div class="gastro-filters" id="gastroFilters">
        <button class="filter-btn active" data-filter="all">Tümü</button>
        <button class="filter-btn" data-filter="ramen">🍜 Ramen & Erişte</button>
        <button class="filter-btn" data-filter="sushi">🍣 Sushi</button>
        <button class="filter-btn" data-filter="meat">🍖 Et & Köri</button>
        <button class="filter-btn" data-filter="street">🍢 Sokak Lezzeti</button>
        <button class="filter-btn" data-filter="sweet">🍵 Matcha & Tatlı</button>
        <button class="filter-btn" data-filter="konbini">🏪 Konbini</button>
    </div>

    <main class="gastro-grid" id="gastroGrid"></main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div class="lightbox-caption" id="lightbox-caption"></div>
        <button class="lightbox-nav prev" onclick="event.stopPropagation(); navigateLightbox(-1)">‹</button>
        <button class="lightbox-nav next" onclick="event.stopPropagation(); navigateLightbox(1)">›</button>
    </div>

    <script src="lightbox.js"></script>

        },
        {

    // --- Yıldız üretici ---
    function renderStars(rating) {
        let html = '';
        for (let i = 1; i <= 5; i++) {
            if (rating >= i)            html += '<span class="star-full">★</span>';
            else if (rating >= i - 0.5) html += '<span class="star-half">★<span>★</span></span>';
            else                        html += '<span class="star-empty">★</span>';
        }
        return html;
    }

    // --- Kart üretici ---
    function renderDishes(filter = 'all') {
        const grid = document.getElementById('gastroGrid');
        grid.innerHTML = '';

        dishes
            .filter(d => filter === 'all' || d.category === filter)
            .forEach(d => {
                let photosHTML;
                if (d.photos && d.photos.length) {
                    const cls = d.photos.length === 1 ? 'single' : '';
                    photosHTML = `<div class="food-photos ${cls}">` +
                        d.photos.map(p =>
                            `<img src="${p}" alt="${d.name}" loading="lazy"
                                  onclick="openLightbox('${p}')"
                                  onerror="this.parentElement.classList.add('empty');this.parentElement.innerHTML='🍽️'">`
                        ).join('') + '</div>';
                } else {
                    photosHTML = `<div class="food-photos empty">🍽️</div>`;
                }

                const card = document.createElement('div');
                card.className = 'food-card';
                card.innerHTML = `
                    ${photosHTML}
                    <div class="food-card-body">
                        <div class="food-card-head">
                            <h3>${d.name}</h3>
                            <span class="food-type-badge">${labelFor(d.category)}</span>
                        </div>
                        <div class="food-place">📍 ${d.place}</div>
                        <div class="food-rating">
                            <span class="stars">${renderStars(d.rating)}</span>
                            <span class="score">${d.rating.toFixed(1)} / 5</span>
                        </div>
                        <p class="food-desc">${d.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

        // lightbox.js fotoğraf listesini tazele
        if (typeof collectPhotos === 'function') collectPhotos();
    }

    function labelFor(cat) {
        return { ramen: 'Ramen & Erişte', sushi: 'Sushi', meat: 'Et & Köri',
                 street: 'Sokak Lezzeti', sweet: 'Matcha & Tatlı', konbini: 'Konbini' }[cat] || cat;
    }

    // --- Filtre olayları ---
    document.getElementById('gastroFilters').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDishes(btn.dataset.filter);
    });

    renderDishes();
    </script>
</body>
</html>
