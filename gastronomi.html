    // --- Yıldız üretici ---
    function renderStars(rating) {
        let html = '';
        for (let i = 1; i <= 5; i++) {
            if (rating >= i)            html += '<span class="star-full">★</span>';
            else if (rating >= i - 0.5) html += '<span class="star-half">★<span>★</span></span>';
            else                        html += '<span class="star-empty">★</span>';
        }
        return html;
    }

    // --- Kart üretici ---
    function renderDishes(filter = 'all') {
        const grid = document.getElementById('gastroGrid');
        grid.innerHTML = '';

        dishes
            .filter(d => filter === 'all' || d.category === filter)
            .forEach(d => {
                let photosHTML;
                const local = d.photos && d.photos.length ? d.photos : [];
                if (local.length) {
                    const cls = local.length === 1 ? 'single' : '';
                    photosHTML = `<div class="food-photos ${cls}">` +
                        local.map(p =>
                            `<img src="${p}" alt="${d.name}" loading="lazy" style="object-position:${d.pos || 'center'}"
                                  onclick="openLightbox(this.getAttribute('src'))"
                                  onerror="useSample(this, ${d.ref ? 'true' : 'false'})">`
                        ).join('') + '</div>';
                } else if (d.ref) {
                    photosHTML = `<div class="food-photos single"><img src="${d.ref.url}" alt="${d.name}" loading="lazy" data-sample="1"
                                  onclick="openLightbox(this.getAttribute('src'))"
                                  onerror="useSample(this, false)"><a class="sample-credit" href="${d.ref.page}" target="_blank" rel="noopener">Örnek görsel · ${d.ref.credit}</a></div>`;
                } else {
                    photosHTML = `<div class="food-photos empty">🍽️</div>`;
                }
                if (d.ref) { sampleRefs[d.name] = d.ref; }
                if (d.ref) photosHTML = photosHTML.replace('<div class="food-photos', '<div data-dish="' + d.name.replace(/"/g, '&quot;') + '" class="food-photos');

                const card = document.createElement('div');
                card.className = 'food-card';
                card.innerHTML = `
                    ${photosHTML}
                    <div class="food-card-body">
                        <div class="food-card-head">
                            <h3>${d.name}</h3>
                            <span class="food-type-badge">${labelFor(d.category)}</span>
                        </div>
                        <div class="food-place">📍 ${d.place}</div>
                        <div class="food-rating">
                            <span class="stars">${renderStars(d.rating)}</span>
                            <span class="score">${d.rating.toFixed(1)} / 5</span>
                        </div>
                        <p class="food-desc">${d.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });

        // lightbox.js fotoğraf listesini tazele
        if (typeof collectPhotos === 'function') collectPhotos();
    }

    // Kendi fotoğrafın yoksa Wikimedia Commons'taki serbest lisanslı örnek görsel gösterilir.
    // Kendi fotoğrafını photos/gastronomi/ içine koyunca otomatik olarak o görünür.
    const sampleRefs = {};
    function useSample(img, hasRef) {
        const box = img.parentElement;
        const ref = sampleRefs[box.dataset.dish];
        if (!hasRef || !ref || img.dataset.sample) { box.classList.add('empty'); box.innerHTML = '🍽️'; return; }
        img.dataset.sample = '1';
        img.src = ref.url;
        img.onclick = () => openLightbox(ref.url);
        if (!box.querySelector('.sample-credit')) {
            const a = document.createElement('a');
            a.className = 'sample-credit'; a.href = ref.page; a.target = '_blank'; a.rel = 'noopener';
            a.textContent = 'Örnek görsel · ' + ref.credit;
            box.appendChild(a);
        }
    }

    function labelFor(cat) {
        return { ramen: 'Ramen & Erişte', sushi: 'Sushi', meat: 'Et & Köri',
                 street: 'Sokak Lezzeti', sweet: 'Matcha & Tatlı', konbini: 'Konbini', drink: 'İçecek & Vitamin' }[cat] || cat;
    }

    // --- Filtre olayları ---
    document.getElementById('gastroFilters').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDishes(btn.dataset.filter);
    });

    renderDishes();
    </script>
</body>
</html>
